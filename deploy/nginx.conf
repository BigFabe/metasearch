# Complete configuration for a dedicated Nginx instance.
# Replace the hostname and certificate paths before use.
worker_processes auto;
error_log /dev/null crit;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    error_log /dev/null crit;
    server_tokens off;

    # Apply even to errors generated before proxying.
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 8k;
    client_body_buffer_size 16k;
    client_body_in_file_only off;

    server {
        listen 80 default_server;
        server_name _;
        # Do not reflect a query into an HTTP-to-HTTPS redirect.
        return 400;
    }

    server {
        listen 443 ssl default_server;
        server_name search.example.com;
        ssl_certificate /etc/letsencrypt/live/search.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/search.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache off;
        ssl_session_tickets off;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host search.example.com;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Referer "";
            proxy_set_header User-Agent "";
            proxy_cache off;
            proxy_store off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_hide_header Cache-Control;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Content-Type-Options;
        }
    }
}
